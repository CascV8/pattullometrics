name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nhl-microstats
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: nhl-microstats/uv.lock
      - name: Run tests
        working-directory: nhl-microstats
        run: uv run pytest -q
